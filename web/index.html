        "mainEntity": [
          { "@type": "Question", "name": "How often is the earthquake data updated?", "acceptedAnswer": { "@type": "Answer", "text": "ShakeViewer refreshes earthquake data every 60 seconds in the 24-hour view and every 5 minutes for the 7-day and 30-day views." } },
          { "@type": "Question", "name": "What does earthquake magnitude mean?", "acceptedAnswer": { "@type": "Answer", "text": "Earthquake magnitude measures the energy released during a seismic event. The moment magnitude scale (Mw) is logarithmic — each whole number increase represents roughly 32 times more energy released." } },
          { "@type": "Question", "name": "What is the difference between earthquake depth categories?", "acceptedAnswer": { "@type": "Answer", "text": "Shallow earthquakes occur at depths less than 70 km and typically cause the most surface damage. Intermediate earthquakes range from 70–300 km deep, while deep earthquakes occur below 300 km." } },
          { "@type": "Question", "name": "Where do most earthquakes occur?", "acceptedAnswer": { "@type": "Answer", "text": "Most earthquakes occur along tectonic plate boundaries, especially around the Pacific Ring of Fire. ShakeViewer can display tectonic plate boundary overlays." } },
          { "@type": "Question", "name": "How can I search for historical earthquakes?", "acceptedAnswer": { "@type": "Answer", "text": "Use ShakeViewer's Custom search mode to set a date range, minimum magnitude, and optionally draw a geographic boundary on the map." } }
        ]
