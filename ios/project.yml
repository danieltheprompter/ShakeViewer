name: ShakeViewer
options:
  bundleIdPrefix: com.shakeviewer
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.19.2"
targets:
  ShakeViewer:
    type: application
    platform: iOS
    sources:
      - path: ShakeViewer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shakeviewer.app
        PRODUCT_NAME: ShakeViewer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ShakeViewer
        INFOPLIST_FILE: Support/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.weather"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "ShakeViewer uses your location only while you use the app, to center the map on you and show how far away earthquakes are. Your location stays on your device."
    scheme:
      testTargets:
        - ShakeViewerUITests
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
  ShakeViewerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ShakeViewerUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shakeviewer.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ShakeViewer
    dependencies:
      - target: ShakeViewer
